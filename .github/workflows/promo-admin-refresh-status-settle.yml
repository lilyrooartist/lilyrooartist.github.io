name: Promo admin refresh status settle

on:
  # The primary refresh is the only automatic writer. Run this manually only
  # when a maintainer needs to regenerate its status snapshot.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # This job writes the same generated admin/data files as the primary refresh.
  # Share its queue so a scheduled refresh cannot rebase against this commit.
  group: promo-admin-refresh
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LILYROO_ADMIN_PASSWORD: ${{ secrets.LILYROO_ADMIN_PASSWORD }}
      LILYROO_EXECUTOR_BEARER_TOKEN: ${{ secrets.LILYROO_EXECUTOR_BEARER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Settle promo admin refresh status
        run: |
          git pull --ff-only origin main
          python3 scripts/refresh_promo_admin.py
          set +e
          validation_output="$(python3 scripts/validate_content_system.py 2>&1)"
          validation_status=$?
          set -e
          printf '%s\n' "$validation_output"
          if [ "$validation_status" -ne 0 ]; then
            if printf '%s\n' "$validation_output" | grep -q "Traceback (most recent call last)"; then
              echo "::error::Content system validator crashed."
              exit "$validation_status"
            fi
            echo "::warning::Content system validator reported diagnostics; the safe refresh completed."
          fi

      - name: Commit settled admin data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No settled promo admin status changes to commit."
          else
            git add admin data
            git commit -m "Settle promo admin refresh status"
            git pull --rebase origin main
            git push
          fi
