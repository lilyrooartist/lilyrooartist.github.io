name: Promo admin refresh

on:
  schedule:
    - cron: "17 */6 * * *"
    # Analog Myth campaign posts publish at 10:15/11:20 AM America/New_York.
    # Refresh shortly after both slots so posted URLs and readouts update faster.
    - cron: "25 15 * * *"
    - cron: "05 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promo-admin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LILYROO_ADMIN_PASSWORD: ${{ secrets.LILYROO_ADMIN_PASSWORD }}
      LILYROO_EXECUTOR_BEARER_TOKEN: ${{ secrets.LILYROO_EXECUTOR_BEARER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run safe promo admin refresh
        run: python3 scripts/refresh_promo_admin.py

      - name: Validate content system
        run: |
          set +e
          validation_output="$(python3 scripts/validate_content_system.py 2>&1)"
          validation_status=$?
          set -e
          printf '%s\n' "$validation_output"
          if [ "$validation_status" -ne 0 ]; then
            if printf '%s\n' "$validation_output" | grep -q "Traceback (most recent call last)"; then
              echo "::error::Content system validator crashed."
              exit "$validation_status"
            fi
            echo "::warning::Content system validator reported diagnostics; refresh_promo_admin.py remains the hard scheduled-refresh gate."
          fi
          python3 -m py_compile \
            scripts/refresh_promo_admin.py \
            scripts/capture_social_executions.py \
            scripts/export_social_executions.py \
            scripts/capture_x_post_results.py \
            scripts/capture_facebook_post_results.py \
            scripts/prefill_youtube_experiment_results.py \
            scripts/reconcile_social_execution_snapshot.py \
            scripts/capture_github_workflow_status.py \
            scripts/update_promo_engine_status.py \
            scripts/build_brand_growth_readout.py \
            scripts/build_brand_growth_preflight.py \
            scripts/build_brand_click_tracking_health.py \
            scripts/build_tiktok_setup_preflight.py \
            scripts/build_tiktok_repair_runbook.py \
            scripts/set_tiktok_public_posting_approval.py \
            scripts/tiktok_oauth_handoff.py \
            scripts/build_experiment_result_collection.py \
            scripts/build_experiment_publish_runway.py \
            scripts/capture_github_actions_secret_presence.py \
            scripts/push_github_actions_secrets.py \
            scripts/resolve_instagram_business_account.py \
            scripts/build_social_blocker_input_status.py \
            scripts/build_posting_automation_status.py \
            scripts/update_experiment_results.py \
            scripts/build_promo_operations_packet.py \
            scripts/build_manual_metric_collection.py \
            scripts/validate_content_system.py

      - name: Commit refreshed admin data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No promo admin refresh changes to commit."
          else
            git add admin data
            git commit -m "Refresh promo admin snapshots"
            git pull --rebase origin main
            git push
          fi
