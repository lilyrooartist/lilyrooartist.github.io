<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lily Roo · Progress</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<style>
:root{--bg:#070709;--card:#121219;--text:#f6f4f0;--muted:#b6b1a9;--line:rgba(246,244,240,.14);--gold:#cba86f;--red:#8b1c2b;--ok:#5fa36a;--warn:#d0953b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 ui-monospace,"Space Mono",Menlo,monospace}
main{max-width:960px;margin:0 auto;padding:1.2rem}h1{font-size:1.3rem;margin:.2rem 0}h2{font-size:1rem;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin:1.6rem 0 .6rem}
.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;margin:.5rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.bar{height:10px;background:#222;border-radius:5px;overflow:hidden;margin:.4rem 0}.bar i{display:block;height:100%;background:var(--gold)}
.big{font-size:1.5rem}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.35rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.75rem;border:1px solid var(--line)}
.done{background:var(--ok);color:#000}.doing{background:var(--warn);color:#000}.blocked{background:var(--red)}.todo{color:var(--muted)}
.owner-Tod{color:var(--gold)}#gate{max-width:340px;margin:18vh auto;text-align:center}
input,button{font:inherit;padding:.55rem .8rem;border-radius:6px;border:1px solid var(--line);background:#111;color:var(--text)}button{cursor:pointer;background:var(--red)}
#app{display:none}body.authed #gate{display:none}body.authed #app{display:block}
</style></head>
<body>
<form id="gate" autocomplete="off"><h1>Lily Roo admin</h1><p class="muted">Password</p>
<input id="pw" type="password" autofocus> <button>Open</button><p id="err" class="muted"></p>
<p class="muted" style="font-size:.75rem">Not real security: this page and progress.json are public files.</p></form>
<main id="app">
<h1>Lily Roo · 8-week plan</h1><p class="muted" id="meta"></p>
<h2>Targets</h2><div class="grid" id="targets"></div>
<h2 id="wk-title">This week</h2><div class="card"><table id="week"></table></div>
<h2>Blockers needing Tod</h2><div class="card"><table id="blockers"></table></div>
<h2>All weeks</h2><div id="weeks"></div>
<h2>Metrics history</h2><div class="card" style="overflow-x:auto"><table id="metrics"></table></div>
<h2>Log</h2><div class="card"><table id="log"></table></div>
<p class="muted"><a style="color:var(--gold)" href="progress.json">progress.json</a> · edit it to update this page (see admin/README.md)</p>
</main>
<script>
// Same digest + storage key as the old admin, so the existing password keeps working.
const ADMIN_AUTH_KEY='lilyroo_admin_password_v1';
const ADMIN_PASSWORD_DIGEST='24b26ab1e602268c369f95fc3612fd80417c9d0fcb90b965ce8f4b227943c8df';
async function sha256(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function ok(v){return !!v&&(await sha256(v))===ADMIN_PASSWORD_DIGEST}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=s=>`<span class="chip ${esc(s)}">${esc(s)}</span>`;
const row=t=>`<tr><td>${chip(t.status)}</td><td class="owner-${esc(t.owner)}">${esc(t.owner)}</td><td>${esc(t.title)}${t.notes?`<br><span class="muted">${esc(t.notes)}</span>`:''}</td><td class="muted">${esc(t.platform)}</td></tr>`;
function currentWeek(start){const d=Math.floor((Date.now()-new Date(start+'T00:00:00'))/864e5);return d<0?1:Math.min(8,Math.floor(d/7)+1)}
async function render(){
  const p=await (await fetch('progress.json',{cache:'no-store'})).json();
  const before=Date.now()<new Date(p.plan_start+'T00:00:00');const wk=currentWeek(p.plan_start);
  document.getElementById('meta').textContent=`Start ${p.plan_start} · updated ${p.updated} · ${before?'not started yet (showing week 1)':'week '+wk+' of 8'}`;
  const latest={};for(const m of p.metrics)for(const k in m)if(m[k]!==null&&k!=='date')latest[k]=m[k];
  document.getElementById('targets').innerHTML=Object.entries(p.targets).map(([k,t])=>{const v=latest[k];const pct=v==null?0:Math.min(100,Math.round(v/t*100));
    return `<div class="card"><div class="muted">${esc((p.target_labels||{})[k]||k)}</div><div class="big">${v==null?'—':v} <span class="muted" style="font-size:.9rem">/ ${t}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="muted">${v==null?'no data yet':pct+'%'}</div></div>`}).join('');
  const w=p.weeks.find(x=>x.week===wk)||{};
  document.getElementById('wk-title').textContent=`This week · W${wk}: ${w.focus||''} (from ${w.starts||'?'})`;
  document.getElementById('week').innerHTML=p.tasks.filter(t=>t.week===wk).map(row).join('')||'<tr><td class="muted">No tasks.</td></tr>';
  const bl=p.tasks.filter(t=>t.owner==='Tod'&&t.status!=='done'&&(t.status==='blocked'||t.week<=wk));
  document.getElementById('blockers').innerHTML=bl.map(t=>row(t).replace('<td>',`<td class="muted">W${t.week}</td><td>`)).join('')||'<tr><td class="muted">Nothing waiting on Tod.</td></tr>';
  document.getElementById('weeks').innerHTML=p.weeks.map(x=>{const ts=p.tasks.filter(t=>t.week===x.week);const d=ts.filter(t=>t.status==='done').length;
    return `<details class="card"${x.week===wk?' open':''}><summary>W${x.week} · ${esc(x.focus)} · ${esc(x.starts)} <span class="muted">(${d}/${ts.length} done)</span></summary><table>${ts.map(row).join('')}</table></details>`}).join('');
  const cols=Object.keys(p.metrics[0]||{});
  document.getElementById('metrics').innerHTML=`<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+p.metrics.map(m=>`<tr>${cols.map(c=>`<td>${m[c]==null?'<span class="muted">—</span>':esc(m[c])}</td>`).join('')}</tr>`).join('');
  document.getElementById('log').innerHTML=[...p.log].reverse().map(l=>`<tr><td class="muted">${esc(l.date)}</td><td>${esc(l.text)}</td></tr>`).join('');
}
async function unlock(){document.body.classList.add('authed');try{await render()}catch(e){document.getElementById('meta').textContent='Could not load progress.json: '+e}}
document.getElementById('gate').addEventListener('submit',async e=>{e.preventDefault();const v=document.getElementById('pw').value;
  if(await ok(v)){localStorage.setItem(ADMIN_AUTH_KEY,v);unlock()}else document.getElementById('err').textContent='Wrong password.'});
(async()=>{if(await ok(localStorage.getItem(ADMIN_AUTH_KEY)))unlock()})();
</script>
</body></html>
